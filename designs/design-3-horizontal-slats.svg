<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" role="img" aria-labelledby="title desc">
  <title id="title">Design 3 - Horizontal-slat 14 gauge steel gate</title>
  <desc id="desc">Front elevation of a 33 by 78 inch mild-steel gate with fifteen simple horizontal rectangular-tube slats and estimated weight 43 kilograms.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#475569}.label{font-size:18px;font-weight:700}.note{font-size:17px;fill:#334155}.dim{stroke:#334155;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{stroke:#94a3b8;stroke-width:1.5}.frame{fill:#263746}.slat{fill:#899aa8;stroke:#566673;stroke-width:1}.thin{stroke:#94a3b8;stroke-width:2;fill:none}</style></defs>
  <rect width="1000" height="1300" fill="#f8fafc"/>
  <text x="70" y="58" class="title">DESIGN 3 — HORIZONTAL SLATS</text><text x="70" y="90" class="sub">33 × 78 in finished leaf · simple straight lines · 14 gauge</text>
  <line x1="280" y1="120" x2="220" y2="120" class="ext"/><line x1="280" y1="1020" x2="220" y2="1020" class="ext"/><line x1="235" y1="120" x2="235" y2="1020" class="dim"/><text x="205" y="640" class="label" transform="rotate(-90 205 640)">1,981 mm / 78 in</text>
  <line x1="280" y1="1040" x2="280" y2="1100" class="ext"/><line x1="660" y1="1040" x2="660" y2="1100" class="ext"/><line x1="280" y1="1080" x2="660" y2="1080" class="dim"/><text x="385" y="1110" class="label">838 mm / 33 in</text>
  <rect x="280" y="120" width="380" height="900" class="frame"/><rect x="298" y="138" width="344" height="864" fill="#eef3f6"/>
  <line x1="470" y1="145" x2="470" y2="995" stroke="#2563eb" stroke-width="12" stroke-dasharray="15 10" opacity=".45"/>
  <g class="slat">
    <rect x="298" y="164" width="344" height="22"/><rect x="298" y="220" width="344" height="22"/><rect x="298" y="276" width="344" height="22"/><rect x="298" y="332" width="344" height="22"/><rect x="298" y="388" width="344" height="22"/><rect x="298" y="444" width="344" height="22"/><rect x="298" y="500" width="344" height="22"/><rect x="298" y="556" width="344" height="22"/><rect x="298" y="612" width="344" height="22"/><rect x="298" y="668" width="344" height="22"/><rect x="298" y="724" width="344" height="22"/><rect x="298" y="780" width="344" height="22"/><rect x="298" y="836" width="344" height="22"/><rect x="298" y="892" width="344" height="22"/><rect x="298" y="948" width="344" height="22"/>
  </g>
  <rect x="615" y="555" width="12" height="80" rx="4" fill="#172033"/><circle cx="608" cy="595" r="7" fill="#f59e0b"/><rect x="267" y="230" width="14" height="70" rx="4" fill="#f59e0b"/><rect x="267" y="535" width="14" height="70" rx="4" fill="#f59e0b"/><rect x="267" y="840" width="14" height="70" rx="4" fill="#f59e0b"/>
  <path d="M660 185 H760 V220" class="thin"/><text x="775" y="209" class="label">Outer frame</text><text x="775" y="235" class="note">40×40×1.9 mm</text><text x="775" y="259" class="note">14 gauge MS</text>
  <path d="M642 445 H760" class="thin"/><text x="775" y="435" class="label">15 horizontal slats</text><text x="775" y="461" class="note">50×25×1.9 mm RHS</text><text x="775" y="485" class="note">clear gap ≈ 72 mm</text>
  <path d="M470 700 H760" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/><text x="775" y="690" class="label">Hidden centre brace</text><text x="775" y="716" class="note">25×25×1.9 mm</text>
  <rect x="700" y="895" width="235" height="100" rx="12" fill="#e8f3ec" stroke="#3f7d52" stroke-width="2"/><text x="722" y="934" class="label" fill="#245c38">EST. FINISHED WEIGHT</text><text x="767" y="978" style="font:700 34px Arial;fill:#245c38">~ 43 kg</text>
  <rect x="70" y="1150" width="860" height="105" rx="8" fill="#fff7ed" stroke="#fb923c"/><text x="92" y="1183" class="label">FABRICATION NOTE</text><text x="92" y="1213" class="note">Open slats allow airflow but do not provide privacy.</text><text x="92" y="1241" class="note">Reduce openings if child or pet safety rules require it, then recalculate weight.</text>
</svg>
